<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0a0f;
  color:#e4e4ed;
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased
}
a{color:#818cf8;text-decoration:none;transition:color .2s}
a:hover{color:#a5b4fc}
img{max-width:100%;display:block}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#13131a}
::-webkit-scrollbar-thumb{background:#2d2d3a;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3d3d4a}

/* ===== Layout ===== */
.container{max-width:1280px;margin:0 auto;padding:0 24px}

/* ===== Header ===== */
header{
  background:linear-gradient(180deg,#0f0f1a 0%,#0a0a0f 100%);
  border-bottom:1px solid #1e1e2a;
  position:sticky;top:0;z-index:100;
  padding:16px 0;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px)
}
header .container{
  display:flex;align-items:center;justify-content:space-between;gap:16px
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:22px;font-weight:700;color:#e4e4ed;
  white-space:nowrap
}
.logo-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,#818cf8,#6366f1);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;flex-shrink:0
}
.header-right{display:flex;align-items:center;gap:14px;flex:1;justify-content:flex-end}

/* ===== Search ===== */
.search-wrap{position:relative;max-width:380px;width:100%}
.search-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:#6b6b80;pointer-events:none
}
.search-wrap input{
  width:100%;padding:10px 14px 10px 42px;
  background:#16161f;border:1px solid #22222e;border-radius:10px;
  color:#e4e4ed;font-size:14px;font-family:inherit;
  outline:none;transition:border-color .25s
}
.search-wrap input:focus{border-color:#6366f1}
.search-wrap input::placeholder{color:#5a5a70}

/* ===== Submit Button ===== */
.btn-submit{
  background:linear-gradient(135deg,#6366f1,#818cf8);
  color:#fff;border:none;padding:10px 20px;border-radius:10px;
  font-size:14px;font-weight:500;font-family:inherit;
  cursor:pointer;transition:opacity .25s,transform .15s;
  white-space:nowrap
}
.btn-submit:hover{opacity:.88;transform:translateY(-1px)}
.btn-submit:active{transform:translateY(0)}

/* ===== Ad Banner ===== */
.ad-banner{
  background:#12121c;border:1px dashed #2a2a3a;border-radius:12px;
  padding:20px;margin:24px auto;max-width:900px;
  display:flex;align-items:center;justify-content:center;
  min-height:90px;color:#4a4a60;font-size:13px;letter-spacing:.5px;
  text-transform:uppercase;text-align:center;
  transition:border-color .25s
}
.ad-banner:hover{border-color:#3a3a50}

/* ===== Categories Nav ===== */
.categories-nav{
  padding:20px 0 8px;
  display:flex;flex-wrap:wrap;gap:10px
}
.cat-btn{
  padding:7px 18px;border-radius:20px;
  background:#16161f;border:1px solid #1e1e2a;
  color:#9d9db5;font-size:13px;font-weight:500;font-family:inherit;
  cursor:pointer;transition:all .25s;white-space:nowrap
}
.cat-btn:hover{background:#1e1e2a;color:#e4e4ed}
.cat-btn.active{
  background:linear-gradient(135deg,#6366f1,#818cf8);
  border-color:transparent;color:#fff
}

/* ===== Stats Bar ===== */
.stats-bar{
  display:flex;flex-wrap:wrap;gap:12px 24px;
  padding:12px 0 0;font-size:13px;color:#6b6b80
}
.stats-bar span strong{color:#9d9db5;font-weight:600}

/* ===== Tools Grid ===== */
.tools-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;padding:20px 0 40px
}
.tool-card{
  background:#12121c;border:1px solid #1e1e2a;
  border-radius:14px;padding:20px;
  transition:transform .2s,box-shadow .25s,border-color .25s;
  display:flex;flex-direction:column
}
.tool-card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(99,102,241,.08);
  border-color:#2a2a3e
}
.tool-card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.tool-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;font-weight:600
}
.tool-info{flex:1;min-width:0}
.tool-info h3{
  font-size:16px;font-weight:600;color:#e4e4ed;
  margin-bottom:2px
}
.tool-info .tool-desc{
  font-size:13px;color:#7a7a90;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
}
.tool-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.tool-tag{
  font-size:11px;padding:3px 10px;border-radius:6px;
  background:#1a1a26;color:#6b6b80;border:1px solid #22222e
}
.tool-card .tool-link{
  margin-top:12px;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;color:#818cf8;align-self:flex-start
}
.tool-card .tool-link:hover{color:#a5b4fc}
.tool-card .tool-link svg{width:14px;height:14px;transition:transform .2s}
.tool-card .tool-link:hover svg{transform:translateX(3px)}

/* ===== Category icon colors ===== */
.cat-chat .tool-icon{background:linear-gradient(135deg,#22d3ee,#06b6d4)}
.cat-image .tool-icon{background:linear-gradient(135deg,#f472b6,#ec4899)}
.cat-code .tool-icon{background:linear-gradient(135deg,#34d399,#10b981)}
.cat-video .tool-icon{background:linear-gradient(135deg,#fb923c,#f97316)}
.cat-audio .tool-icon{background:linear-gradient(135deg,#a78bfa,#8b5cf6)}
.cat-productivity .tool-icon{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.cat-writing .tool-icon{background:linear-gradient(135deg,#67e8f9,#22d3ee)}
.cat-search .tool-icon{background:linear-gradient(135deg,#c084fc,#a855f7)}
.cat-other .tool-icon{background:linear-gradient(135deg,#94a3b8,#64748b)}

/* ===== Ad in Grid ===== */
.tool-card.ad-card{
  border:1px dashed #2d2d40;
  align-items:center;justify-content:center;text-align:center;
  min-height:180px;cursor:default
}
.tool-card.ad-card:hover{
  transform:none;
  border-color:#3d3d55;
  box-shadow:none
}
.ad-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:#4a4a60;font-size:12px;letter-spacing:.3px
}
.ad-placeholder svg{width:28px;height:28px;opacity:.5}

/* ===== Empty state ===== */
.empty-state{
  grid-column:1/-1;
  text-align:center;padding:60px 20px;color:#5a5a70
}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:15px}

/* ===== Footer ===== */
footer{
  border-top:1px solid #1e1e2a;
  padding:32px 0;margin-top:16px;
  text-align:center;font-size:13px;color:#5a5a70
}
footer a{color:#7a7a90}
footer a:hover{color:#a5b4fc}

/* ===== Ad Sidebar (desktop only) ===== */
.ad-sidebar{
  display:none;
  position:fixed;top:200px;right:0;
  width:140px;min-height:400px;
  background:#12121c;border:1px dashed #2a2a3a;
  border-radius:12px 0 0 12px;border-right:none;
  align-items:center;justify-content:center;
  color:#4a4a60;font-size:11px;letter-spacing:.3px;
  text-align:center;padding:12px;
  transition:border-color .25s
}
.ad-sidebar:hover{border-color:#3a3a50}

/* ===== Responsive ===== */
@media(min-width:1400px){.ad-sidebar{display:flex}}

@media(max-width:768px){
  header .container{flex-wrap:wrap}
  .header-right{order:3;width:100%;justify-content:stretch}
  .search-wrap{max-width:none}
  .tools-grid{grid-template-columns:1fr}
  .ad-banner{min-height:70px;padding:14px;margin:16px auto}
  .logo{font-size:18px}
  .btn-submit{font-size:13px;padding:10px 16px}
}

@media(max-width:480px){
  .container{padding:0 16px}
  .tool-card{padding:16px}
  .categories-nav{gap:8px}
  .cat-btn{font-size:12px;padding:6px 14px}
}

/* ===== Fade In ===== */
.fade-in{animation:fadeIn .4s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.no-transition{transition:none!important}
</style>

  {name:"Replicate",icon:"🔁",cat:"other",desc:"云端运行开源 AI 模型的 API 平台，即用即付。",url:"https://replicate.com",tags:["API","云端","开源模型"]},
  {name:"Civitai",icon:"🏛️",cat:"other",desc:"Stable Diffusion 模型与 LoRA 的分享社区。",url:"https://civitai.com",tags:["SD","模型","社区"]},
  {name:"Poe",icon:"🤖",cat:"other",desc:"聚合多种 AI 聊天机器人的平台，一站式体验。",url:"https://poe.com",tags:["聚合","多模型","聊天"]}
];

const cats = [
  {id:"all",label:"全部",icon:"★"},
  {id:"chat",label:"AI 对话",icon:"💬"},
  {id:"image",label:"图像生成",icon:"🎨"},
  {id:"code",label:"编程开发",icon:"💻"},
  {id:"video",label:"视频创作",icon:"🎬"},
  {id:"audio",label:"音频处理",icon:"🔊"},
  {id:"writing",label:"文字写作",icon:"✍️"},
  {id:"search",label:"AI 搜索",icon:"🔍"},
  {id:"productivity",label:"效率工具",icon:"⚡"},
  {id:"other",label:"其他",icon:"🔧"}
];

// ===== State =====
let currentCat = "all";
let searchQuery = "";

// ===== Render =====
function renderCategories(){
  const el = document.getElementById("categoriesNav");
  el.innerHTML = cats.map(c=>`
    <button class="cat-btn${c.id===currentCat?' active':''}" data-cat="${c.id}">
      ${c.icon} ${c.label}
    </button>
  `).join("");
  el.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentCat = btn.dataset.cat;
      renderCategories();
      renderTools();
    });
  });
}

function renderStats(filtered){
  document.getElementById("statsBar").innerHTML = `
    <span>共 <strong>${tools.length}</strong> 个工具</span>
    <span>当前分类 <strong>${filtered.length}</strong> 个</span>
  `;
}

function renderTools(){
  const q = searchQuery.trim().toLowerCase();
  let filtered = tools;
  if(currentCat!=="all") filtered = filtered.filter(t=>t.cat===currentCat);
  if(q) filtered = filtered.filter(t=>
    t.name.toLowerCase().includes(q)||
    t.desc.toLowerCase().includes(q)||
    t.tags.some(tag=>tag.toLowerCase().includes(q))
  );

  renderStats(filtered);

  const grid = document.getElementById("toolsGrid");
  if(filtered.length===0){
    grid.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>没有找到匹配的工具，试试其他关键词吧</p></div>`;
    return;
  }

  // Insert ad cards every 6 items
  let adIndex = 0;
  const adSlots = [6,13];
  let html = "";
  filtered.forEach((t,i)=>{
    if(adSlots.includes(i)){
      html += adCard(adIndex++);
    }
    html += toolCard(t,i);
  });
  grid.innerHTML = html;

  // Animate
  requestAnimationFrame(()=>{
    grid.querySelectorAll(".tool-card").forEach((el,i)=>{
      el.style.opacity="0";
      el.style.transform="translateY(8px)";
      el.style.transition="opacity .3s ease,transform .3s ease";
      requestAnimationFrame(()=>{
        el.style.transitionDelay=(i*30)+"ms";
        el.style.opacity="1";
        el.style.transform="translateY(0)";
      });
    });
  });
}

function toolCard(t,i){
  return `<div class="tool-card cat-${t.cat} fade-in" style="animation-delay:${i*30}ms">
    <div class="tool-card-top">
      <div class="tool-icon">${t.icon}</div>
      <div class="tool-info">
        <h3>${t.name}</h3>
        <p class="tool-desc">${t.desc}</p>
      </div>
    </div>
    <div class="tool-tags">${t.tags.map(tag=>`<span class="tool-tag">${tag}</span>`).join("")}</div>
    <a href="${t.url}" target="_blank" rel="noopener" class="tool-link">
      访问 →<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
    </a>
  </div>`;
}

function adCard(idx){
  return `<div class="tool-card ad-card" onclick="alert('📢 广告位 #${idx+1} 招租 · 联系 ad@ainav.example')" style="cursor:pointer">
    <div class="ad-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M8 2v20"/><path d="M16 2v20"/></svg>
      <span>广告位 #${idx+1} · 招租</span>
    </div>
  </div>`;
}

// ===== Search =====
document.getElementById("searchInput").addEventListener("input",e=>{
  searchQuery = e.target.value;
  renderTools();
});

// ===== Init =====
renderCategories();
renderTools();
</script>
</body>
</html>
